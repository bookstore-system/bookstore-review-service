apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service-deployment
  labels:
    app: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
      - name: review-service
        image: truongdocker1/bookstore-review-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JWT_SIGNER_KEY
          value: "unused"
        - name: APP_JWT_KEYS_DIR
          value: "/key"
        - name: APP_JWT_PUBLIC_KEY_FILE
          value: "public.pem"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: review-service-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: review-service-secret
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: review-service-secret
              key: DB_PASSWORD
        - name: CLIENTS_BOOK_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: review-service-config
              key: BOOK_SERVICE_URL
        - name: CLIENTS_USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: review-service-config
              key: USER_SERVICE_URL
        - name: CLIENTS_ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: review-service-config
              key: ORDER_SERVICE_URL
        volumeMounts:
        - name: jwt-keys
          mountPath: /key
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: jwt-keys
        secret:
          secretName: jwt-keys
          items:
          - key: public.pem
            path: public.pem
